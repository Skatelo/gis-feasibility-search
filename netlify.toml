# Netlify build + SPA routing for the Vite app
[build]
  command = "npm run build"
  publish = "dist"

  # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are flagged as "sensitive" in
  # this site's environment variables, but Vite inlines VITE_-prefixed vars
  # into the client bundle by design (the anon key is meant to be public;
  # Supabase tables are protected by Row-Level Security, not by hiding this
  # key). Without this, Netlify's secret scanner finds its own env var value
  # inside dist/**, the exact place it is supposed to be, and fails every
  # build/deploy from GitHub.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Serverless functions (e.g. the RentCast proxy that avoids browser CORS).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@crawlee/cheerio", "@crawlee/playwright", "@sparticuz/chromium", "playwright-core", "mammoth", "pdf-parse", "read-excel-file", "saxen"]

[functions."report-background-sweeper"]
  schedule = "*/5 * * * *"

# Serve index.html for every path so client routing + the Supabase OAuth
# redirect (detectSessionInUrl) work after deploy. Netlify routes
# /.netlify/functions/* before redirects, so this doesn't intercept functions.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
